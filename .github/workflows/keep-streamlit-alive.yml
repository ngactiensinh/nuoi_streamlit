name: 🌅 Đánh thức Streamlit Apps

on:
  schedule:
    # 6 tiếng/lần (giờ UTC). Streamlit cho app ngủ sau ~12 tiếng không ai vào,
    # nên 6 tiếng để dư chỗ khi GitHub chạy trễ hoặc bỏ lượt.
    # Phút 17 thay vì 00 để tránh giờ cao điểm của GitHub.
    - cron: "17 */6 * * *"
  workflow_dispatch:   # cho phép bấm chạy tay

# Không cho 2 lượt chạy chồng lên nhau
concurrency:
  group: wake-streamlit
  cancel-in-progress: false

jobs:
  wake-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 55   # script tự dừng ở 45 phút, còn dư để lưu ảnh chụp

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Cài dependencies
        run: pip install selenium

      - name: 🌐 Cài Chrome & ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: 🚀 Chạy script đánh thức
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          PYTHONUNBUFFERED: "1"
          MAX_WORKERS: "4"
          TOTAL_BUDGET: "2700"   # 45 phút
        run: python -u wake_streamlit.py

      - name: 📸 Lưu ảnh chụp các app có vấn đề
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
